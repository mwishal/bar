<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in - Google Accounts (Demo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

  body {
    background: #fff;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Wadah utama untuk menengahkan konten di bawah gambar */
  .main-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* CSS Gambar Header - Full Width */
  .header-image {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    border-radius: 0;
    box-shadow: none;
  }

  /* CSS Footer */
  .footer {
    width: 100%;
    margin-top: auto;
  }

  /* CSS Gambar Footer - Full Width */
  .footer-image {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .card {
    width: 450px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 48px 40px;
    text-align: center;
    margin-top: 0px;
  }

  .logo { font-size: 24px; color: #5f6368; margin-bottom: 20px; }
  .logo span:nth-child(1){color:#4285F4} .logo span:nth-child(2){color:#EA4335}
  .logo span:nth-child(3){color:#FBBC05} .logo span:nth-child(4){color:#4285F4}
  .logo span:nth-child(5){color:#34A853} .logo span:nth-child(6){color:#EA4335}

  h1 { font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 10px; }
  p.sub { color: #5f6368; font-size: 16px; margin-bottom: 30px; }

  .input-group {
    position: relative;
    margin-bottom: 20px;
    text-align: left;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    outline: none;
  }

  .input-group input:focus {
    border-color: #1a73e8;
    box-shadow: inset 0 0 0 1px #1a73e8;
  }

  .input-group label {
    position: absolute;
    left: 16px;
    top: 14px;
    color: #5f6368;
    font-size: 16px;
    pointer-events: none;
    transition: all .15s;
    background: #fff;
    padding: 0 4px;
  }

  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: -9px;
    font-size: 12px;
    color: #1a73e8;
  }

  .btn {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn:hover { background: #1765cc; }

  .forgot {
    display: inline-block;
    color: #1a73e8;
    font-size: 14px;
    text-decoration: none;
    margin-top: 20px;
  }

  /* Popup */
  #popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    justify-content: center;
    align-items: center;
  }

  .popup-box {
    background: #fff;
    border-radius: 8px;
    padding: 24px 32px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  .popup-box h2 {
    color: #202124;
    font-size: 20px;
    margin-bottom: 8px;
  }

  .popup-box p {
    color: #5f6368;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .popup-box button {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <!-- Wadah utama untuk menengahkan konten di bawah gambar -->
  <div class="main-container">

    <!-- GAMBAR HEADER FULL WIDTH -->
    <img src="browser-google.png" alt="Tampilan Browser Google" class="header-image">

    <div class="card">
      <div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
      <h1>Sign in</h1>
      <p class="sub">Use your Google Account</p>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <input type="email" id="email" placeholder=" " autocomplete="off">
          <label for="email">Email or phone</label>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder=" " autocomplete="off">
          <label for="password">Enter your password</label>
        </div>
        <a href="#" class="forgot">Forgot email?</a><br>
        <button type="submit" class="btn">Log in</button>
      </form>
    </div>
  </div>

  <!-- GAMBAR FOOTER FULL WIDTH -->
  <footer class="footer">
    <img src="browser-google.png" alt="Tampilan Browser Google" class="footer-image">
  </footer>

  <div id="popup">
    <div class="popup-box">
      <h2>Fake Google</h2>
      <p>This is a mock page for research purposes.</p>
      <button onclick="document.getElementById('popup').style.display='none'">Close</button>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); // no data is sent
    document.getElementById('popup').style.display = 'flex';
  });
});
</script>
</body>
</html>
